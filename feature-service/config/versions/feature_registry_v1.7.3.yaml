version: 1.7.3
config:
  timestamp_interval_minutes: 15
features:
- name: candle_0_is_green
  input_sources:
  - kline
  lookback_window: 45m
  lookahead_forbidden: true
  max_lookback_days: 1
  data_sources:
  - source: kline
    timestamp_required: true
