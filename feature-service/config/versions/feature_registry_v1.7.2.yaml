version: 1.7.2
config:
  timestamp_interval_minutes: 5
features:
- name: candle_0_is_green
  input_sources:
  - kline
  lookback_window: 15m
  lookahead_forbidden: true
  max_lookback_days: 1
  data_sources:
  - source: kline
    timestamp_required: true
- name: candle_1_is_green
